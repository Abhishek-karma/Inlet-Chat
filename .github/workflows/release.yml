# Release workflow: triggered on tags (v*) or manual workflow_dispatch
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.0)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  release:
    name: Build, Sign & Publish APK Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Extract Release Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$TAG" ] && [ "${TAG:0:1}" != "v" ]; then
            VERSION=$(grep 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
            TAG="v$VERSION"
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          if ! [[ "$MAJOR" =~ ^[0-9]+$ ]] || ! [[ "$MINOR" =~ ^[0-9]+$ ]] || ! [[ "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "::error::Tag version '$VERSION' is not in the expected MAJOR.MINOR.PATCH numeric format."
            exit 1
          fi
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Configured for Tag: $TAG (Version: $VERSION, versionCode: $VERSION_CODE)"

      - name: Run Unit Tests
        run: ./gradlew testReleaseUnitTest

      - name: Run Android Lint
        run: ./gradlew lint

      - name: Configure Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required signing secrets. Ensure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD are set."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/keystore"
          KEYSTORE_PATH="$RUNNER_TEMP/keystore/release.keystore"

          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Failed to decode ANDROID_KEYSTORE_BASE64 into a valid keystore file."
            exit 1
          fi

          {
            echo "storeFile=$KEYSTORE_PATH"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties

      - name: Assemble Release APK
        run: >
          ./gradlew :app:assembleRelease
          -PversionName=${{ steps.get_version.outputs.version }}
          -PversionCode=${{ steps.get_version.outputs.version_code }}

      - name: Verify Signed APK & Generate SHA-256 Checksum
        id: verify_apk
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$RAW_APK" ] || [ ! -f "$RAW_APK" ]; then
            echo "::error::Signed Release APK not found in app/build/outputs/apk/release."
            exit 1
          fi

          echo "Located release APK: $RAW_APK"

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner tool not found in $ANDROID_HOME/build-tools."
            exit 1
          fi

          echo "Verifying signature with $APKSIGNER..."
          $APKSIGNER verify --verbose "$RAW_APK"
          if [ $? -ne 0 ]; then
            echo "::error::apksigner signature verification failed for $RAW_APK."
            exit 1
          fi

          OUTPUT_DIR="$RUNNER_TEMP/dist"
          mkdir -p "$OUTPUT_DIR"
          FINAL_APK_NAME="L0-${VERSION}.apk"
          FINAL_APK_PATH="$OUTPUT_DIR/$FINAL_APK_NAME"
          CHECKSUM_PATH="$OUTPUT_DIR/${FINAL_APK_NAME}.sha256"

          cp "$RAW_APK" "$FINAL_APK_PATH"

          cd "$OUTPUT_DIR"
          sha256sum "$FINAL_APK_NAME" > "${FINAL_APK_NAME}.sha256"

          echo "apk_path=$FINAL_APK_PATH" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$CHECKSUM_PATH" >> "$GITHUB_OUTPUT"
          echo "Generated $FINAL_APK_NAME with SHA-256 checksum:"
          cat "${FINAL_APK_NAME}.sha256"

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: l0-release-apk-and-checksum
          path: |
            ${{ steps.verify_apk.outputs.apk_path }}
            ${{ steps.verify_apk.outputs.checksum_path }}
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: ${{ steps.get_version.outputs.tag }}
          files: |
            ${{ steps.verify_apk.outputs.apk_path }}
            ${{ steps.verify_apk.outputs.checksum_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up temporary signing material
        if: always()
        run: |
          rm -f keystore.properties
          rm -rf "$RUNNER_TEMP/keystore"
          echo "Temporary keystore files and keystore.properties cleaned up."
